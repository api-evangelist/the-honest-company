name: The Honest Company
description: >-
  The Honest Company is a consumer-goods brand selling baby, personal-care,
  beauty, and household products through its direct-to-consumer storefront at
  honest.com and through major retailers. It was surfaced in the API Evangelist
  network as a portfolio company of iconiq-capital, ivp, and
  lightspeed-venture-partners. The honest.com storefront runs on Shopify and
  does not publish a first-party developer API; the only machine-readable API
  surface discoverable on the domain is Shopify's Customer Account API
  (OIDC/OAuth2) advertised via the store's /.well-known/ discovery documents.
  This profile captures that authentication surface, the domain security
  posture, and the storefront's public web properties.
